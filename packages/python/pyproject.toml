[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "decilist"
version = "0.1.0a1"
description = "Local-first decision contracts, policies, and evaluation for developers"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["pydantic>=2.14.1,<3", "httpx>=0.28.1,<1"]

[project.scripts]
decilist = "decilist.cli:main"

[project.optional-dependencies]
server = ["fastapi>=0.162,<1", "starlette>=1.10,<2", "uvicorn>=0.54,<1"]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1.2,<2", "build>=1.3,<2"]
liquid = ["transformers==5.14.1", "torch>=2.9,<3", "torchvision>=0.24,<1", "pillow>=12,<13"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
decilist = ["py.typed", "static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
