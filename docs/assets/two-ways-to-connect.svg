<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-labelledby="t d">
  <title id="t">Two ways to connect Decilist to your project</title>
  <desc id="d">In a Python app, import Decilist and call a provider in the same process. From TypeScript or any other language, send HTTP to a local Decilist runtime on 127.0.0.1 port 8765, and the runtime calls the provider.</desc>
  <style>
    .sans { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, "Cascadia Code", Consolas, Menlo, monospace; }
    .lane { font-size: 19px; font-weight: 700; fill: #b9f48c; }
    .name { font-size: 20px; font-weight: 600; fill: #f2f6f5; }
    .sub { font-size: 15px; fill: #9cafb2; }
    .code { font-size: 15px; fill: #c9d5d6; }
    .box { fill: #142023; stroke: #2b3c41; }
    .sdk { fill: #16261f; stroke: #b9f48c; stroke-width: 2; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#9cafb2"/>
    </marker>
  </defs>
  <rect width="1200" height="500" rx="18" fill="#0d1416"/>

  <text x="40" y="52" class="sans lane">Python: in the same process</text>
  <rect x="40" y="70" width="1140" height="140" rx="12" fill="none" stroke="#2b3c41" stroke-dasharray="6 5"/>
  <text x="60" y="98" class="sans sub">Your Python process</text>
  <rect x="60" y="112" width="260" height="82" rx="10" class="box"/>
  <text x="80" y="146" class="sans name">Your code</text>
  <text x="80" y="174" class="mono code">import decilist</text>
  <line x1="326" y1="153" x2="384" y2="153" stroke="#9cafb2" stroke-width="2" marker-end="url(#a)"/>
  <rect x="390" y="112" width="250" height="82" rx="10" class="sdk"/>
  <text x="410" y="146" class="sans name">Decilist SDK</text>
  <text x="410" y="174" class="mono code">Decilist([provider])</text>
  <line x1="666" y1="153" x2="844" y2="153" stroke="#9cafb2" stroke-width="2" marker-end="url(#a)"/>
  <rect x="850" y="112" width="310" height="82" rx="10" class="box"/>
  <text x="870" y="146" class="sans name">Provider</text>
  <text x="870" y="174" class="sans sub">Rules, your model, or d1-3B</text>

  <line x1="40" y1="248" x2="1160" y2="248" stroke="#2b3c41"/>

  <text x="40" y="292" class="sans lane">TypeScript or any language: over local HTTP</text>
  <rect x="40" y="316" width="260" height="124" rx="10" class="box"/>
  <text x="60" y="352" class="sans name">Your app</text>
  <text x="60" y="380" class="sans sub">TypeScript SDK, or plain</text>
  <text x="60" y="402" class="sans sub">HTTP from any language</text>

  <line x1="306" y1="378" x2="474" y2="378" stroke="#9cafb2" stroke-width="2" marker-end="url(#a)"/>
  <text x="390" y="358" class="mono" font-size="14" fill="#c9d5d6" text-anchor="middle">POST /v1/decisions</text>
  <text x="390" y="402" class="mono" font-size="14" fill="#9cafb2" text-anchor="middle">127.0.0.1:8765</text>

  <rect x="480" y="316" width="320" height="124" rx="10" class="sdk"/>
  <text x="500" y="352" class="sans name">Decilist runtime</text>
  <text x="500" y="380" class="mono" font-size="13.5" fill="#c9d5d6">python -m decilist runtime start</text>
  <text x="500" y="406" class="sans sub">A local Python process. Loopback only.</text>

  <line x1="806" y1="378" x2="844" y2="378" stroke="#9cafb2" stroke-width="2" marker-end="url(#a)"/>
  <rect x="850" y="316" width="310" height="124" rx="10" class="box"/>
  <text x="870" y="352" class="sans name">Provider</text>
  <text x="870" y="380" class="sans sub">Demo rules or d1-3B, chosen</text>
  <text x="870" y="402" class="sans sub">when the runtime starts</text>
</svg>
