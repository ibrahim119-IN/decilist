name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -c requirements-dev.lock -e 'packages/python[server,dev]'
      - run: python -m pytest -q
      - run: npm ci
      - run: npm test
      - run: python -m build packages/python
      - run: python -m benchmarks.run --output reports/local/ci.json
      - name: TypeScript to Python HTTP integration
        shell: bash
        run: |
          python -m uvicorn apps.api.main:from_environment --factory --host 127.0.0.1 --port 8765 --no-access-log &
          api_pid=$!
          trap 'kill "$api_pid"' EXIT
          python scripts/wait_for_api.py
          python -m examples.http_client
          npm run demo
