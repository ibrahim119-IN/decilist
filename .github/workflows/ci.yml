name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # The triage lab replays pinned historical source revisions.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -c requirements-dev.lock -e 'packages/python[server,dev]'
      - name: Restore byte-pinned historical V5 fixture evidence
        env:
          DECILIST_TRIAGE_V5_WORK_ROOT: ${{ runner.temp }}/decilist-fixtures/work/triage-v5-lab
        run: python scripts/restore_triage_v5_fixture_evidence.py
      - run: python -m pytest -q
        env:
          DECILIST_TRIAGE_V5_WORK_ROOT: ${{ runner.temp }}/decilist-fixtures/work/triage-v5-lab
      - run: npm ci
      - run: npm test
      - run: python scripts/verify_contract_parity.py
      - run: python -m build packages/python
      - run: python -m benchmarks.run --output reports/local/ci.json
      - name: Python HTTP integration through the explicit launcher
        run: python -m decilist runtime run --provider demo -- python -m examples.http_client
      - name: TypeScript HTTP integration through the explicit launcher
        run: python -m decilist runtime run --provider demo -- node examples/workflow.mjs
